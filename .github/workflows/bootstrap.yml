name: Bootstrap MIELOGOS Prize site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest staging ZIP
        shell: bash
        run: |
          ZIP=$(ls -t MIELOGOS_Prize_GitHub_Staging_v*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "MIELOGOS Prize staging ZIP not found."
            exit 1
          fi
          echo "Using staging package: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Unpack website
        shell: bash
        run: |
          rm -rf /tmp/mielogos-prize-site
          mkdir -p /tmp/mielogos-prize-site
          unzip -q -o "$ZIP" -d /tmp/mielogos-prize-site
          cp -a /tmp/mielogos-prize-site/. .

      - name: Remove staging ZIP packages
        shell: bash
        run: |
          rm -f MIELOGOS_Prize_GitHub_Staging_v*.zip

      - name: Commit unpacked site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Deploy MIELOGOS Literary Prize website update"
          git push
