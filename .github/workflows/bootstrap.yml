name: Bootstrap MIELOGOS Prize site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find staging ZIP
        run: |
          ZIP="MIELOGOS_Prize_GitHub_Staging_v0.1.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Staging ZIP not found: $ZIP"
            exit 1
          fi

      - name: Unpack website
        run: |
          mkdir -p /tmp/mielogos-prize-site
          unzip -q -o MIELOGOS_Prize_GitHub_Staging_v0.1.zip -d /tmp/mielogos-prize-site
          cp -a /tmp/mielogos-prize-site/. .
          rm MIELOGOS_Prize_GitHub_Staging_v0.1.zip

      - name: Commit unpacked site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Deploy MIELOGOS Literary Prize website v0.1"
          git push
