name: 'MIELOGOS — clean 25 obsolete test files (one time)'

# Operator-only. This workflow never deploys the site or enables intake.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DELETE_25_TEST_FILES to approve exactly 25 deletions'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mielogos-one-time-test-cleanup
  cancel-in-progress: false

jobs:
  remove-obsolete-tests:
    name: 'Remove exactly 25 obsolete files'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 'Check out main'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: 'Preflight, remove, verify and commit'
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          INVOKED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$INVOKED_REF" != 'refs/heads/main' ]]; then
            echo '::error::Run this workflow on main only.'
            exit 1
          fi
          if [[ "$CONFIRMATION" != 'DELETE_25_TEST_FILES' ]]; then
            echo '::error::Wrong confirmation. Nothing was removed.'
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo '::error::Checkout is not clean. Nothing was removed.'
            exit 1
          fi

          # Protected working files: never delete or modify them.
          for keep in \
              '.github/workflows/bootstrap.yml' \
              'enter/index.html' \
              'enter/submission-2027.html' \
              'assets/js/prize-intake-v0-1.js' \
              'assets/css/prize-intake-v0-1.css' \
              'data/cycles.json'; do
            if [[ ! -f "$keep" ]]; then
              echo "::error::Required working file missing: $keep"
              exit 1
            fi
          done

          mapfile -t obsolete <<'FILES'
          enter/intake-integration-v0-1-2-cover.html
          enter/intake-integration-v0-1.html
          enter/intake-test-v0-1.html
          enter/integration-gate-v0-1-commit.html
          enter/integration-gate-v0-1-init-upload.html
          enter/integration-gate-v0-1-late-recovery.html
          enter/integration-gate-v0-1-prepare.html
          enter/integration-gate-v0-1-recovery.html
          enter/integration-gate-v0-1-review-upload.html
          enter/submission-preproduction-v0-1-10-confirmations.html
          enter/submission-preproduction-v0-1-2.html
          enter/submission-preproduction-v0-1-4.html
          enter/submission-preproduction-v0-1-5.html
          enter/submission-preproduction-v0-1-6.html
          enter/submission-preproduction-v0-1-7-production-connection.html
          enter/submission-preproduction-v0-1-8-production-connection.html
          enter/submission-preproduction-v0-1-9-production-connection.html
          enter/submission-preproduction-v0-1.html
          enter/submission-production-candidate-v0-1-11-1.html
          enter/submission-production-candidate-v0-1-11.html
          tools/gate-upload-50mb-v0-1-20261007.html
          tools/gate-upload-50mb-v0-2-1-20261007.html
          tools/gate-upload-50mb-v0-2-20261007.html
          tools/gate-upload-50mb-v0-3-1-20261007.html
          tools/gate-upload-50mb-v0-3-20261007.html
          FILES

          if [[ "${#obsolete[@]}" -ne 25 ]]; then
            echo '::error::Internal safety count is not 25. Nothing was removed.'
            exit 1
          fi
          expected_sorted="$(printf '%s\n' "${obsolete[@]}" | LC_ALL=C sort)"
          if [[ "$(printf '%s\n' "${obsolete[@]}" | LC_ALL=C sort -u)" != "$expected_sorted" ]]; then
            echo '::error::Duplicate file in allowlist. Nothing was removed.'
            exit 1
          fi
          for file in "${obsolete[@]}"; do
            if [[ ! -f "$file" ]] || ! git ls-files --error-unmatch -- "$file" >/dev/null 2>&1; then
              echo "::error::Expected tracked test file missing: $file. Nothing was removed."
              exit 1
            fi
          done

          # Any extra obsolete HTML in enter/ must be reviewed separately.
          for file in enter/*.html; do
            case "$file" in
              'enter/index.html'|'enter/submission-2027.html') continue ;;
            esac
            if ! printf '%s\n' "${obsolete[@]}" | grep -Fxq -- "$file"; then
              echo "::error::Unexpected file in enter/: $file. Nothing was removed."
              exit 1
            fi
          done

          echo 'Preflight PASS — exactly 25 approved test files; protected files exist.'
          git rm -- "${obsolete[@]}"

          staged_sorted="$(git diff --cached --name-only | LC_ALL=C sort)"
          if [[ "$staged_sorted" != "$expected_sorted" ]]; then
            echo '::error::Staged paths differ from exact allowlist. No commit created.'
            exit 1
          fi
          if [[ "$(git diff --cached --name-only --diff-filter=D | wc -l | tr -d ' ')" != '25' ]]; then
            echo '::error::Staged changes are not exactly 25 deletions. No commit created.'
            exit 1
          fi
          echo 'Staged diff PASS — exactly 25 deletions, no other changes.'
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Remove 25 obsolete MIELOGOS prelaunch test files'
          git push origin HEAD:main
          echo 'CLEANUP COMPLETE — 25 old test files removed in one commit.'
          echo 'Production form, bootstrap workflow and all site runtime assets kept.'
