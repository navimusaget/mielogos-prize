<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>INTEGRATION-GATE v0.1 — Review Upload Test</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{margin:0;background:#f3efe6;color:#191816}
    main{max-width:760px;margin:0 auto;padding:28px 18px 64px}
    .card{background:#fffdf8;border:1px solid #c9c1b4;padding:22px;margin:16px 0}
    .warn{border-left:5px solid #966c27}
    .ok{border-left:5px solid #2f8a57}
    .bad{border-left:5px solid #a83939}
    h1{font-size:30px;line-height:1.1;margin:0 0 8px}
    h2{font-size:20px;margin:0 0 12px}
    p{line-height:1.5}
    label{display:block;margin:16px 0 6px;font-weight:700}
    input,button{font:inherit}
    input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #8e887e;background:#fff;color:#111}
    button{width:100%;padding:14px;border:0;background:#966c27;color:#fff;font-weight:800;margin-top:18px}
    button:disabled{opacity:.55}
    pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word;background:#161616;color:#f4f4f4;padding:14px;overflow:auto}
    .small{font-size:13px;color:#625d55}
    progress{width:100%;height:18px;margin-top:14px}
  </style>
</head>
<body>
<main>
  <section class="card warn">
    <h1>INTEGRATION-GATE v0.1</h1>
    <p><strong>SANDBOX REVIEW-COPY UPLOAD TEST.</strong> This sends the already prepared test PDF in 512 KiB chunks to the existing sandbox resumable session.</p>
    <p>No Submission ID is allocated and no sandbox commit occurs in this step.</p>
  </section>

  <section class="card">
    <h2>1. Inputs</h2>
    <label for="secret">Integration test secret</label>
    <input id="secret" type="password" autocomplete="off">

    <label for="file">Choose the SAME PDF used in PREPARE</label>
    <input id="file" type="file" accept=".pdf,application/pdf">

    <button id="run" type="button">UPLOAD REVIEW COPY TO SANDBOX</button>
    <progress id="progress" max="100" value="0"></progress>
    <p id="progress-text" class="small">Waiting.</p>
  </section>

  <section class="card" id="result-card">
    <h2>2. Result</h2>
    <p id="summary">No upload started.</p>
    <pre id="out">Waiting.</pre>
  </section>
</main>

<script>
(() => {
  'use strict';

  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxnXH32goGMPjDCSrl9r8VNS36k4x-lx2-VzdtxOHyuJo7TLuTzo5k-y0aRUyMOUrzx/exec';
  const REQUEST_ID = 'itg_38593d42bfa446cd9aa8790533e98490';
  const EXPECTED_SIZE = 1444590;
  const EXPECTED_SHA256 = 'a5c80e8650a3e1733414946473e95084059b49d809f691a2eeeafb3601576b31';
  const CHUNK_SIZE = 512 * 1024;

  const $ = id => document.getElementById(id);

  function setResult(kind, summary, obj) {
    const card = $('result-card');
    card.classList.remove('ok','bad');
    if (kind) card.classList.add(kind);
    $('summary').textContent = summary;
    $('out').textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
  }

  function setProgress(done, total, text) {
    const pct = total ? Math.floor(done * 100 / total) : 0;
    $('progress').value = pct;
    $('progress-text').textContent = `${pct}% · ${done} / ${total} bytes · ${text}`;
  }

  async function sha256File(file) {
    const buf = await file.arrayBuffer();
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function bytesToBase64(bytes) {
    let binary = '';
    const step = 0x8000;
    for (let i = 0; i < bytes.length; i += step) {
      binary += String.fromCharCode(...bytes.subarray(i, i + step));
    }
    return btoa(binary);
  }

  async function postNoCors(body) {
    await fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      cache: 'no-store',
      headers: {'Content-Type':'text/plain;charset=UTF-8'},
      body: JSON.stringify(body)
    });
  }

  function jsonpStatus(secret, timeoutMs=20000) {
    return new Promise((resolve, reject) => {
      const cb = '__mielogos_cb_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      let timer;

      window[cb] = data => {
        clearTimeout(timer);
        try { delete window[cb]; } catch (_) { window[cb] = undefined; }
        script.remove();
        resolve(data);
      };

      script.onerror = () => {
        clearTimeout(timer);
        try { delete window[cb]; } catch (_) { window[cb] = undefined; }
        script.remove();
        reject(new Error('Status JSONP request failed.'));
      };

      const q = new URLSearchParams({
        action: 'status',
        request_id: REQUEST_ID,
        test_secret: secret,
        callback: cb,
        _: String(Date.now())
      });

      script.src = ENDPOINT + '?' + q.toString();
      document.head.appendChild(script);

      timer = setTimeout(() => {
        try { delete window[cb]; } catch (_) { window[cb] = undefined; }
        script.remove();
        reject(new Error('Status request timed out.'));
      }, timeoutMs);
    });
  }

  async function pollStatus(secret) {
    let lastErr;
    for (let i = 0; i < 5; i++) {
      try {
        return await jsonpStatus(secret);
      } catch (err) {
        lastErr = err;
        await new Promise(r => setTimeout(r, 2000));
      }
    }
    throw lastErr || new Error('Status polling failed.');
  }

  async function waitForAdvance(secret, beforeOffset, total) {
    let last = null;
    for (let i = 0; i < 10; i++) {
      last = await pollStatus(secret);

      if (!last || last.ok !== true) {
        throw new Error('Status endpoint returned an invalid response: ' + JSON.stringify(last));
      }

      if (last.last_error_code) {
        throw new Error(last.last_error_code + ': ' + (last.last_error_summary || ''));
      }

      if (last.upload_complete === true) return last;
      if (Number(last.upload_next_offset || 0) > beforeOffset) return last;

      await new Promise(r => setTimeout(r, 1200));
    }

    throw new Error('Server offset did not advance after chunk upload.');
  }

  async function run() {
    const btn = $('run');
    btn.disabled = true;

    try {
      const secret = $('secret').value.trim();
      const file = $('file').files[0];

      if (!secret) throw new Error('Enter the Integration test secret.');
      if (!file) throw new Error('Choose the same PDF used in PREPARE.');
      if (file.size !== EXPECTED_SIZE) {
        throw new Error(`Wrong file size. Expected ${EXPECTED_SIZE} bytes, got ${file.size}.`);
      }

      setProgress(0, EXPECTED_SIZE, 'calculating SHA-256');
      const actualHash = await sha256File(file);

      if (actualHash !== EXPECTED_SHA256) {
        throw new Error('Wrong test file: SHA-256 does not match the PREPARED request.');
      }

      let status = await pollStatus(secret);

      if (!status.ok) throw new Error('Request status not found.');
      if (status.submission_id) throw new Error('Unexpected Submission ID already allocated.');
      if (status.committed) throw new Error('Request is already committed.');

      if (status.upload_complete === true) {
        setProgress(EXPECTED_SIZE, EXPECTED_SIZE, 'already complete');
        setResult('ok', 'SANDBOX REVIEW UPLOAD ALREADY COMPLETE — safe idempotent status.', status);
        return;
      }

      if (!['UPLOAD_READY','UPLOADING'].includes(status.transaction_state)) {
        throw new Error('Unexpected transaction_state: ' + status.transaction_state);
      }

      let offset = Number(status.upload_next_offset || 0);
      setProgress(offset, EXPECTED_SIZE, 'resuming from server journal');

      while (offset < EXPECTED_SIZE) {
        const endExclusive = Math.min(offset + CHUNK_SIZE, EXPECTED_SIZE);
        const slice = file.slice(offset, endExclusive);
        const bytes = new Uint8Array(await slice.arrayBuffer());
        const b64 = bytesToBase64(bytes);

        setProgress(offset, EXPECTED_SIZE, `sending chunk ${offset}-${endExclusive - 1}`);

        await postNoCors({
          action: 'upload_chunk',
          test_secret: secret,
          request_id: REQUEST_ID,
          offset,
          total_size: EXPECTED_SIZE,
          chunk_base64: b64
        });

        status = await waitForAdvance(secret, offset, EXPECTED_SIZE);

        if (status.upload_complete === true) {
          offset = EXPECTED_SIZE;
          break;
        }

        const next = Number(status.upload_next_offset || 0);
        if (next <= offset) throw new Error('Server offset did not advance.');
        offset = next;
        setProgress(offset, EXPECTED_SIZE, 'chunk accepted');
      }

      status = await pollStatus(secret);

      const pass =
        status.ok === true &&
        status.transaction_state === 'UPLOAD_COMPLETE' &&
        status.last_completed_stage === 'UPLOAD_VERIFIED' &&
        status.upload_complete === true &&
        Number(status.uploaded_size_bytes) === EXPECTED_SIZE &&
        Number(status.upload_next_offset) === EXPECTED_SIZE &&
        status.submission_id === '' &&
        status.committed === false &&
        status.production_submission === false &&
        status.official_receipt === false;

      if (!pass) {
        setResult('bad', 'UPLOAD finished but final sandbox state is not the expected one.', status);
        return;
      }

      setProgress(EXPECTED_SIZE, EXPECTED_SIZE, 'complete');
      setResult('ok',
        'SANDBOX REVIEW UPLOAD PASS — file reached private quarantine; no Submission ID and no commit.',
        status
      );

    } catch (err) {
      setResult('bad', 'SANDBOX REVIEW UPLOAD FAILED', String(err && err.stack || err));
    } finally {
      btn.disabled = false;
    }
  }

  $('run').addEventListener('click', run);
})();
</script>
</body>
</html>
